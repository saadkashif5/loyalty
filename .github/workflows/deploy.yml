name: Deploy

# Builds the four images, pushes them to GitHub Container Registry and rolls the
# Hetzner server onto them. Setup: docs/deploy-hetzner.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: api, target: api, app: "" }
          - { name: web, target: next, app: web }
          - { name: admin, target: next, app: admin }
          - { name: portal, target: next, app: portal }
    steps:
      - uses: actions/checkout@v4
      - id: image
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          build-args: |
            APP=${{ matrix.app }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          push: true
          tags: |
            ${{ steps.image.outputs.prefix }}/${{ matrix.name }}:${{ github.sha }}
            ${{ steps.image.outputs.prefix }}/${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    name: Deploy to server
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Copy compose files
        run: scp deploy/docker-compose.yml deploy/Caddyfile "deploy@${{ secrets.DEPLOY_HOST }}:~/stamply/"
      - name: Pull and restart
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | ssh "deploy@${{ secrets.DEPLOY_HOST }}" \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin && \
             cd ~/stamply && \
             export TAG='${{ github.sha }}' && \
             docker compose pull && \
             docker compose up -d --remove-orphans --wait --wait-timeout 180 && \
             docker image prune -f && \
             docker logout ghcr.io"
